  - pregunta: "¿Qué es la diversidad o la biodiversidad?"
    concepto: "Diversidad, Biodiversidad"
    definiciones:
      01:
        texto: >
          Dícese del requisito fundamental de sistemas humanos y no-humanos para lograr dar respuesta a los cambios bruscos o paulatinos que se producen en el ambiente con el correr del tiempo; condición habilitante para la regeneración de tales sistemas.

          La evolución/regeneración de lo vivo en entornos cambiantes—y todos los son—requiere de un reservorio de diferencias en los individuos de las especies que lo cohabitan; una comunidad diversa asegura un conjunto de características, habilidades y competencias distintas para responder y, finalmente, dar solución, a los nuevos desafíos que impone el cambio permanente. La igualdad de aquello que puede individualizarse dentro del sistema ofrece una única posibilidad de respuesta a un problema nuevo. El fracaso de esa única opción, termina toda esperanza de adaptación, evolución y regeneración del sistema. Por ende, extinción y muerte son consecuencias lógicas de la ausencia de diversidad.
        persona: "Rocío Ángulo"
        contexto: "Doctora en Psicología, Instituto de Ciencias Sociales U. de O´Higgins"
      02:
        texto: "La biodiversidad o diversidad biológica es la diversidad de la vida en múltiples dimensiones, reflejadas no solo a nivel de las especies de plantas, animales, hongos o microorganismos que existen, sino que abarca desde la diversidad genética en una población de seres vivos, hasta la diversidad de ecosistemas que encontramos en el planeta. La biodiversidad contribuye a la resiliencia de los ecosistemas, es decir, la capacidad de recuperarse o quizás regenerarse después de ser perturba dos. La variabilidad de organismos, rasgos y estrategias de vida o formas de ser y habitar un ecosistema, es similar a tener inversiones económicas de distinta naturaleza. Ante una crisis, si cae una, el resto puede continuar y la pérdida no es total, con el tiempo incluso se podría recuperar la inversión inicial."
        persona: "Carolina Saavedra"
        contexto: "Encargada Programa Cultura Natural, Museo Interactivo Mirador"
      03:
        texto: "Es la diversidad de seres vivos que, en su interrelación, conforman la biosfera. Incluye la variabilidad presente dentro de un individuo (genética), entre individuos de la misma especie (poblaciones), entre especies (comunidades), pero también en ecosistemas y paisajes. Nos interesa concebir la biodiversidad desde una aproximación biocultural, que remite a un diálogo y evolución conjunta de diversidad biológica y cultural expresada en los conocimientos, rituales, lenguas, formas de manejo y relaciones simbólicas con la naturaleza y sus transformaciones. Es así como la biodiversidad se puede entender como una memoria viva en continua adaptación y movimiento."
        persona: "Maya Errázuriz, Bernardita Pérez, Sebastián Carrasco y Tomás Altamirano"
        contexto: "Fundación Mar Adentro"
  - pregunta: "¿Qué es la ecología?"
    concepto: "Ecología"
    definiciones:
      01:
        texto: "La ecología es la ciencia que estudia cómo los seres vivos —animales, plantas, hongos y microorganismos— se relacionan entre sí y con el lugar donde viven. Esto incluye distintos factores de su entorno natural, como el aire, el agua, el suelo, la luz del sol y la temperatura entre otros. Por ejemplo, cuando observamos cómo los pájaros construyen sus nidos en los árboles, cómo las abejas polinizan las flores, o cómo un bosque cambia con las estaciones del año, estamos viendo interacciones ecológicas en acción. Incluso en una ciudad, cuando vemos cómo las palomas, los perros callejeros o las plantas en una plaza se adaptan al entorno urbano, también estamos observando ecología. La ecología nos ayuda a entender cómo y por qué los organismos están donde están y en qué cantidad. Cómo las interacciones en la naturaleza determinan la estructura y el funcionamiento de los ecosistemas y por qué es importante cuidar el equilibrio entre todos los seres vivos y su ambiente."
        persona: "Carolina Saavedra"
        contexto: "Encargada Programa Cultura Natural, Museo Interactivo Mirador"
      02:
        texto: "Ciencia que estudia el oikos o “la casa” (naturaleza) y se dedica al estudio de las interacciones entre vida, materia y ambiente para analizar cómo estas interacciones determinan la distribución, abundancia y evolución de los organismos en el tiempo y el espacio. Entendemos por ecología un campo dinámico y expansivo que invita a repensar nuestras formas de observar, habitar y narrar el mundo, integrando aproximaciones basadas en la atención sensorial, la comprensión a través de la experiencia y la observación continua, para promover una forma de conocimiento situada y conectada con el cambio ambiental global. Esta visión desafía la idea de que la naturaleza es algo externo, y reconoce la agencia de lo más-que-humano en un mundo profundamente  interconectado."
        persona: "Maya Errázuriz, Bernardita Pérez, Sebastián Carrasco y Tomás Altamirano"
        contexto: "Fundación Mar Adentro"
      03:
        texto: "Ideología que demuestra preocupación por el daño de la humanidad al planeta, por el daño a los seres vivos, la intervención en ecosistemas y la extracción de recursos naturales. Algunas personas de pensamiento ecologista dedican parte de su tiempo al activismo y otros solo hacen campaña en redes sociales. Muchos ecologistas también se unen al movimiento vegano o vegetariano por lo contaminante y cruel que es la industria de la carne. En ocasiones la ecología se opone a algunas actividades económicas y a muchos empresarios y políticos no les gusta mucho eso."
        persona: "Dania Santelices"
        contexto: "Estudiante universitaria, narradora"
  - pregunta: "¿Qué es ecosistema?"
    concepto: "Ecosistema"
    definiciones:
      01:
        texto: "Un ecosistema es una unidad donde plantas, animales, hongos y microorganismos, viven e interactúan entre ellos y con el entorno que los rodea, de forma dinámica, intercambiando energía y materia. Un bosque, un lago, una playa o incluso un jardín pueden ser ecosistemas. En cada uno, los seres vivos dependen unos de otros. Las plantas necesitan del sol y del agua para crecer, los animales se alimentan de plantas o de otros animales, y los microorganismos ayudan a descomponer restos orgánicos para que los nutrientes vuelvan al suelo. Todo está conectado. Si se altera algún factor del ecosistema, como la temperatura, la cantidad de agua o la presencia de una especie, puede afectar a todo lo demás."
        persona: "Carolina Saavedra"
        contexto: "Encargada Programa Cultura Natural, Museo Interactivo Mirador"
      02:
        texto: "Un patio/ Un cielo transparente/ Una maquina cubierta de musgo/ Palabra de cinco silabas y sin H/ Una forma de disciplina/ Una forma de ritmo/ Un invento del siglo XX/ El amor que nunca acaba/ Una muerte sin aviso/ Todas de acuerdo/ Todos en desacuerdo/ Relaciones que se relacionan/ Mascotas sin amo/ Amistades sin familia/ Una familia en paz/ Paz perpetua"
        persona: "Cristóbal Bianchi"
        contexto: "Poeta, psicólogo, miembro del Colectivo Casagrande responsable por intervenir con poesía ciudades bombardeadas"
  - pregunta: "¿Qué es escuchar?"
    concepto: "Escuchar"
    definiciones:
      01:
        texto: "Capacidad para reaccionar al entorno de manera empática. La escucha es un proceso dialógico, es el paso previo a una vuelta a la acción e implica, necesariamente, una relación con otres y con el contexto, una toma de posición en relación a. Es un proceso corporal generalizado, no necesariamente atento ni racional, tiene algo de incontrolable."
        persona: "Elena Blesa"
        contexto: "Mediadora, investigadora y artista, responsable del departamento de educación y mediación de la Fundación Manifesta"
      02:
        texto: "Escuchar es una forma encarnada de atención, una práctica activa de apertura hacia el entorno sonoro y hacia una misma. No se trata solo de registrar estímulos acústicos, sino de habitar el sonido, dejarse afectar por él y permitir que revele dimensiones invisibles del espacio, del cuerpo y del tiempo. Escuchar es una disposición a lo poroso, a lo incierto, a lo que aún no tiene forma. En este gesto se da una sintonía entre percepción, memoria, vibración y cuerpo. Escucharse, en tanto, implica una forma reflexiva y autoafectiva de presencia. Es un modo de estar en relación consigo misma desde el sonido: percibir el eco interno de la experiencia, los desplazamientos del cuerpo en el espacio, las resonancias afectivas, los silencios que revelan y las intensidades que configuran identidad. Escucharse es también prestar atención a lo que se despliega en la práctica —el error, la duda, la improvisación— como fuentes de conocimiento. Ambas dimensiones —escuchar y escucharse— se entrelazan como modos de habitar el mundo desde la percepción. Porque en última instancia, escuchar y escucharse son una misma corriente, un movimiento que nos instala en el presente y nos permite ser testigos de nuestra propia existencia resonando con el mundo."
        persona: "Valentina Maza"
        contexto: "Artista"
      03:
        texto: "Escuchar es una forma de conocer el mundo a partir de la audición. Esta forma alternativa de acceso al conocimiento, implica una experiencia situada en un contexto específico y una temporalidad extendida en una secuencia de episodios sonoros. En ese sentido, escuchar implica observar el tiempo pasar, y también implica una pausa a lo racional para darle cabida a la experiencia sensorial."
        persona: "Sofía Balbontín"
        contexto: "Artista y Arquitecta, Valparaíso"
      04:
        texto: False
        imagen: "escuchar-04.png"
        persona: "Felipe Cruz"
        contexto: "Cuarto básico de la Escuela Casa azul"
  - pregunta: "¿Qué es herida?"
    concepto: "Herida"
    definiciones:
      01:
        texto: " La herida como tal tiene que ver con todo un aspecto político y social que romantiza y precariza lo que es ser campesino y que muchas veces se nos olvida a los que somos de sectores insulares; solo aparecemos en estos programas que denostan nuestras vidas y romantizan la pobreza."
        persona: "Osvaldo Güineo"
        contexto: "Artista textil, isla Cailin, Quellón"
      02:
        texto: >
          Herida es una abertura que es hecha en la piel o en el espí-ritu de un ser viviente por medio de un trauma, golpe o corte.

          Trae atrás de si una marca, una cicatriz que es visible por otro ser o en el reflejo que lo dan los años.

          La herida, por medio de una magia, que solo los biólogos pueden explicar, se cura y se cierra.

          Las heridas más profundas permanecen y son difíciles de borrar. Las heridas superficiales son borradas de la piel como con un soplo de vida.

          Las heridas en el corazón usualmente quedan marcadas para toda la vida.

          Me imagino la herida como un surco que se la hace a la tierra, como si uno quisiera sembrar algo.

          Las heridas sirvan para recordar algo importante. Por eso algunos le causan heridas a otro ser, por el solo hecho de entrar en su memoria, en sus recuerdos y no quedar olvidados, como si nada importara.
        persona: "Anibal Rocha"
        contexto: "Artista visual, grabador, Castro, Chiloé"
  - pregunta: "¿Qué es muerte?"
    concepto: "Muerte"
    definiciones:
      01:
        texto: "La muerte es cuando las estrellas dejan de quemar hidrógeno, o cuando las galaxias dejan de formar estrellas."
        persona: "Manuel Solimano"
        contexto: "Estudiante Doctorado Astrofísica UDP"
      02:
        texto: "Dícese del agotamiento irreversible de los reservorios de diversidad salvaje."
        persona: "Rocío Angulo"
        contexto: "Doctora en Psicología. Instituto de Ciencias Sociales U. de O´Higgins"
      03:
        texto: "La muerte es un ejemplo o expresión de lo regenerativo, aunque parezca que la posibilidad deja de existir, en realidad la muerte es solo transformación. Cada ser con la capacidad de morir se transforma en materia orgánica que posibilita otras vidas, que regeneran la vida misma. La transformación no es solo material, la muerte empuja la plasticidad del cerebro, crea nuevas versiones de una misma y de las otras, a partir de recuerdos, crea nuevas perspectivas y comprensiones. Y aunque es bello y poético, la muerte también genera ira y venganza, crea identidades cómo la de la víctima y nuevos ciclos y versiones de la historia."
        persona: "Luisa Fernanda Villegas"
        contexto: "Comisaria en Centro Nacional de Memoria Histórica, Colombia"
      04:
        texto: "Concebir la muerte de manera regenerativa es nunca más sentir soledad."
        persona: "Guille Mongan"
        contexto: "Academicx, artista. Coordinador de la RedCSur y parte del colectivo de activismo artístico Serigrafistas Queer"
      05:
        texto: "La muerte es una meta por muchas temida y para algunas anhelada ¿qué sentido tendría la vida si no llegara en algún momento la muerte, si tuviéramos que persistir eternamente en las nimiedades del tiempo presente? Perderíamos la memoria, la cordura y el sentido. Dolorosa y gloriosa, la muerte es la condición necesaria de la vida, es la paradoja fundamental."
        persona: "Suman Saha."
        contexto: "Estudiante de postdoctorado en Astronomía, UDP."
      06:
        texto: "Seguir, inconscientemente retozando en El Problema."
        persona: "Isabel Ibañez"
        contexto: "Madre, gestora cultural, licenciada en Historia y Teoría del Arte U de Chile"
  - pregunta: "¿Qué es naturaleza?"
    concepto: "Naturaleza"
    definiciones:
      01:
        texto: "Naturaleza es lo que percibimos del universo, incluso si no refleja la verdad."
        persona: "Suman Saha"
        contexto: "Estudiante de postdoctorado en Astronomía UDP"
      02:
        texto: "Origen que nos constituye."
        persona: "Cristina Echeverría Whipple"
        contexto: "Paisajista"
      03:
        texto: "Itrofil Mongen son todas las diversidades en su conjunto, así como el humano mira los elementos también nos entregan su mirada, nos afectan y nos transfieren fuerzas que nos permiten decidir asuntos estando frente a ellas. Los antepasados también miran y nos ponen asuntos al frente todo el tiempo, ellos también son parte de la naturaleza."
        persona: "Francisco Huichaqueo"
        contexto: "Artista visual y curador mapuche"
  - pregunta: "¿Qué es putrefacción?"
    concepto: "Putrefacción"
    definiciones:
      01:
        texto: "Estado posible de la materia, sustento de la vida. Proliferación de microorganismos que habitan la materi por muerte o descuido."
        persona: "Isabel Ibáñez"
        contexto: "Madre, gestora cultural, licenciada en Historia y Teoría del Arte U de Chile"
  - pregunta: "¿Qué es resolver juntas?"
    concepto: "Resolver juntas"
    definiciones:
      01:
        texto: " En esta isla de Chiloé para mi es muy importante cómo hoy en día la juventud y la gente que se ha integrado a la isla chilota ven la vida desde su mirada. Veo humanamente que por medio de la cultura tradicional ésta se mantiene presente por medio de redes, apoyos y gestores, reuniones y juntas de vecinos. La comunicación es muy importante, porque se construyen legados, vivencias, costumbres con el aporte de cada una de las personas a la vida presente. Actualmente todo tipo de problemas y cambios radicales se pueden presentar en esta vida y son acogidas con diálogos, conversatorios y puntos de vista de cada uno."
        persona: "Silvia Rivera"
        contexto: "Artista, Castro, Chiloé"
  - pregunta: "¿Qué es salvaje o indómito?"
    concepto: "Salvaje, Indómito"
    definiciones:
      01:
        texto: >
          Dícese de aquella característica individual que permanece y resiste los embates de la domesticación. Esta última produce individuos homogéneos, predecibles y monótonos, en entornos creados artificialmente, en el nombre de una pretendida e imposible paz.

          La doma o cultivo del total de individuos de una especie, a través del aseguramiento de sus condiciones materiales mínimas de supervivencia en entornos controlables y predecibles, reduce su variabilidad. En un ambiente ilusoriamente estático, las distintas características, habilidades y competencias de los individuos de una especie no encuentran su oportunidad de ser sometidas a prueba. La docilidad, como característica vencedora en el aseguramiento de mínimos vitales, se replica entonces indefinidamente hasta asfixiar cualquier otra potencialidad. No obstante, el entorno es cambiante—siempre lo es—, y la monotonía doméstica es frágil, vulnerable al desastre. Únicamente en las fieras salvajes encontramos un reservorio de esperanza; si el terror que le produce al sistema su mera existencia no amenazara irremisiblemente su vida como paso previo al desastre colectivo, se abriría un camino de regeneración.
        persona: "Rocío Angulo"
        contexto: "Doctora en Psicología. Instituto de Ciencias Sociales U. de O´Higgins"
      02:
        texto: "Indomable, salvaje, algo que se resiste a ser dominado. Se refiere tanto a la resistencia como a la libertad. Lo indómito puede ser el estado de un sujeto cuando es salvaje y lleno de energía. A menudo se usa para señalar a poblaciones no dominadas, lo primero que se me viene a la mente es el pueblo mapuche."
        persona: "Susana Eyheramendy"
        contexto: "Matemática, doctora en estadística, postdoctorada en matemáticas genéticas"
  - pregunta: "¿Qué es sustentable?"
    concepto: "Sustentable"
    definiciones:
      01:
        texto: "Es un equilibrio dinámico, es decir, una estabilidad en constante cambio, donde una población que interactúa con su entorno, se desarrolla sin afectar de manera negativa e irreversible el ambiente del cual depende. Un desarrollo sustentable, implica un uso responsable de los recursos naturales, respetando la capacidad regenerativa de los ecosistemas y evitando agotar los recursos que provee la naturaleza. Así, futuras generaciones de personas y otros seres vivos, podrán tener acceso a ellos y satisfacer sus necesidades vitales."
        persona: " Carolina Saavedra"
        contexto: "Encargada Programa Cultura Natural, Museo Interactivo Mirador"
      02:
        texto: "Es la manera en que las personas y comunidades gestionan los recursos disponibles, reconociendo que estos son limitados y que su uso debe orientarse hacia una visión de futuro. Esto implica garantizar la capacidad de satisfacer las necesidades presentes sin comprometer las de las generaciones venideras, procurando un equilibrio entre el desarrollo económico, la protección del medioambiente y el bienestar social. Para que la sustentabilidad sea posible, se requiere de un sistema que genere conocimiento, respete la idiosincrasia de las comunidades y considere las interrelaciones dentro de los ecosistemas, con el fin de construir caminos colectivos hacia un futuro compartido. El concepto de sustentabilidad ha sido adaptado creativamente desde la ecología a otros campos del saber. Por ejemplo, la sustentabilidad cultural constituye un campo de estudio y acción que surge como respuesta a las exigencias éticas de la academia y el activismo, orientada a enfrentar los desafíos del trabajo cultural y su transformación en un mundo incierto."
        persona: "María Rosario Bravo Collado"
        contexto: "Directora de Coros y Etnomusicóloga"
      03:
        texto: "Sustentable, aplicase a una actividad o estructura hecha de tal manera que se sostiene en el tiempo sin perjudicar su entorno o que incorpora en su desarrollo o diseño el conjunto de alteraciones inevitables de tal manera que logran un equilibrio que perdura en el tiempo y no crea perjuicios significativos al entorno."
        persona: "Andrés Jordán"
        contexto: "Astrónomo, director del Instituto Milenio de Astrofísica MAS"
  - pregunta: "¿Qué es territorio?"
    concepto: "Territorio"
    definiciones:
      01:
        texto: "Para mí tiene que ver con todo lo que significa habitar un espacio, convivir con una comunidad, con gente, con una cultura, desarrollarla, cultivarla y conversar todo lo que significa el ser isleños, o lo que significa ser campesino, lo que es guardar tradiciones."
        persona: "Osvaldo Güineo"
        contexto: "Artista textil, isla Cailin, Quellón"
      02:
        texto: "El territorio en Chiloé no es solo un espacio geográfico, sino un lugar lleno de historia, cultura y vida. Es el suelo donde las comunidades han tejido sus tradiciones, sus formas de relacionarse con la naturaleza y entre sí. En este archipiélago, el territorio es un patrimonio común que sostiene la identidad colectiva y la memoria ancestral de sus habitantes."
        persona: "Marcela Enriqueta Contreras Iturrieta"
        contexto: "Artesana en lana, Queilen, Quemchi"
      03:
        texto: >
          Para mí, el territorio no es una simple superficie que se delimita en un mapa. Es un cuerpo vivo que me contiene, que me habla, que me recuerda quién soy. Es la memoria de quienes han caminado estos senderos antes que yo, es el murmullo del estero, el nombre antiguo de un cerro, la manera en que el viento roza las tejuelas. El territorio me forma tanto como yo lo habito. El territorio es identidad, es historia y lenguaje compartido.

          En mi trabajo cultural y en mi forma de estar en el mundo, no pienso el territorio como un escenario, sino como un interlocutor. No trabajo en el territorio: me esfuerzo por trabajar con él. Y eso implica respeto, escucha atenta, tiempo y reciprocidad. No concibo la creación sin esta conversación profunda con el entorno, con sus tiempos, con sus silencios.

          El territorio también es comunidad. No puede separarse de las personas que lo habitan, de sus oficios, sus afectos, sus luchas. Es una red viva de vínculos. Cuidarlo no es solo un acto ecológico: es un gesto ético, espiritual y político. Es cuidarnos entre todos. En un mundo cada vez más fragmentado, el territorio me recuerda el sentido de pertenencia. Me da raíces y también horizonte. Me dice que no estoy solo. Que la belleza, la fragilidad y la resistencia están entrelazadas
        persona: "Pablo Carvacho Yáñez"
        contexto: "Gestor cultural, Contuy, Queilen"
  - pregunta: "¿Qué es tiempo?"
    concepto: "Tiempo"
    definiciones:
      01:
        texto: "El tiempo, el presente, es un flujo en permanente cambio donde participa todo lo que existe en el universo."
        persona: "Suman Saha"
        contexto: "Estudiante de postdoctorado en Astronomía UDP"
      02:
        texto: "El tiempo es una magnitud física que, debido a nuestra condición de seres tridimensionales, sólo podemos experimentar en una única dirección: hacia adelante. Esa evolución constante del tiempo está asociada a un incremento inevitable de la entropía, es decir, al aumento del desorden en los sistemas."
        persona: "Kristína Kallová"
        contexto: ". Estudiante de doctorado en Astrofísica UDP"
      03:
        texto: >
          El tiempo, tal como lo entiendo y lo vivo, no está hecho de minutos ni de fechas en un calendario. En mi experiencia, el tiempo tiene que ver con el pulso del mar, con el brote de una semilla, con la luz que entra por una ventana a cierta hora del día. Es un tiempo que no corre: respira. Que no avanza: se despliega.

          Trabajo desde otro ritmo, uno que me permite acompañar los procesos sin violentarlos. El arte, la educación, la comunidad… todo lo que me importa necesita tiempo para enraizar, para florecer. La urgencia —esa trampa moderna— me aleja de lo esencial. Por eso, defender un tiempo habitable, sensible, lento, es también una forma de resistencia. De permanecer fiel a lo que creo.

          Este tiempo más humano me permite escuchar, equivocarme, volver a intentar. Me permite estar presente de verdad, sin apuros ni simulacros. Es el tiempo de la confianza, de lo que no se puede forzar. El tiempo de las relaciones genuinas. Lo vivo cotidianamente en las escuelas rurales, en las residencias artísticas, en cada conversación al borde del fuego.

          Para mí, el tiempo no es una medida. Es un modo de estar en el mundo. Y si hay algo que he aprendido en este oficio de sembrar belleza, es que todo lo valioso necesita espacio para crecer. Ese espacio se llama tiempo.
        persona: "Pablo Carvacho Yáñez"
        contexto: "Gestor cultural, Contuy, Queilen."
      04:
        texto: "Acumulación de desilusiones en un cuerpo que se va haciendo hasta que está hecho y luego comienza a deshacerse."
        persona: "Stefanella Costa Cordero"
        contexto: "Psicóloga"
      05:
        texto: "En la naturaleza, el tiempo es una variable que dimensiona la ocurrencia de procesos que van desde el ciclo celular hasta la evolución. Distintos procesos ocurren en tiempos que pueden variar de unos pocos segundos a millones de años; una vida completa para un organismo como una hormiga macho transcurre en cuestión de días, mientras que para algunas especies de árboles significa miles de años, siendo testigos del paso de generación tras generación de otros seres vivos. Nuestra propia historia como especie humana en la Tierra, es tan solo una pequeña fracción de lo que lleva el desarrollo de la vida en el planeta."
        persona: "Carolina Saavedra"
        contexto: "Encargada Programa Cultura Natural, Museo interactivo Mirador"
